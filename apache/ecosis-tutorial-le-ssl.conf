<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerAdmin webmaster@localhost

        ServerName tutorial.ecosis.org

        DocumentRoot /opt/ecosis-tutorial/www
        <Directory /opt/ecosis-tutorial/www>
                Options Indexes FollowSymLinks MultiViews
                Require all granted
        </Directory>


        ErrorLog ${APACHE_LOG_DIR}/error.log

        # Possible values include: debug, info, notice, warn, error, crit,
        # alert, emerg.
        LogLevel warn

        CustomLog ${APACHE_LOG_DIR}/access.log combined


Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/tutorial.ecosis.org/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/tutorial.ecosis.org/privkey.pem
</VirtualHost>
</IfModule>
