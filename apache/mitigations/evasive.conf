# Deploy to /etc/apache2/mods-available/evasive.conf on the host, then:
#   apt install libapache2-mod-evasive
#   a2enmod evasive
#   mkdir -p /var/log/mod_evasive && chown www-data:www-data /var/log/mod_evasive
#   systemctl restart apache2
#
# Throttles an IP that repeatedly hits the same URI (matches the bot pattern of
# hammering the same /group/<uuid> or /organization/<uuid> page) and caps total
# requests/sec from a single IP across the whole vhost.
<IfModule mod_evasive20.c>
    DOSHashTableSize    3097
    DOSPageCount        5
    DOSPageInterval     1
    DOSSiteCount        50
    DOSSiteInterval     1
    DOSBlockingPeriod   60
    DOSLogDir           "/var/log/mod_evasive"

    # Never throttle localhost (health checks, ckan-helper, etc.)
    DOSWhitelist        127.0.0.1
    DOSWhitelist        ::1

    # Known-good crawlers, so they're never blocked by IP.
    # Verify/refresh these against the publishers' current ranges before relying
    # on them long-term:
    #   https://developers.google.com/static/search/apis/ipranges/googlebot.json
    #   https://www.bing.com/toolbox/bingbot.json
    DOSWhitelist        66.249.64.*
    DOSWhitelist        66.249.65.*
    DOSWhitelist        66.249.66.*
    DOSWhitelist        66.249.79.*
</IfModule>
