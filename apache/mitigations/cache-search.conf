# Deploy to /etc/apache2/mitigations/cache-search.conf on the host and pull in
# from inside ecosis-search-le-ssl.conf's <VirtualHost *:443> block via:
#   IncludeOptional /etc/apache2/mitigations/cache-search.conf
# Requires: a2enmod cache cache_disk headers (rewrite is already enabled on
# this host for the http->https redirect)
#
# Reverse-cache anonymous, non-query /search/*, /package/*, /webassets/*, and
# /base/* responses for 1 hour (all live on ecosis.org / this vhost's
# backend, not data.ecosis.org). /webassets/ and /base/ are static asset
# paths (CSS/JS/images) - same eligibility rules apply for consistency, even
# though they carry no per-user content.
#
# NOTE: this does NOT use <If> around CacheEnable/CacheDisable - this Apache
# build refuses to start with either ("... cannot occur within <If>
# section"). Instead: mod_rewrite sets an env var when the request is
# NOT eligible to be cached (the exact negation of the rules below, since
# RewriteCond [OR] chains read as "if ANY of these is true, skip caching"),
# then mod_headers injects a Cache-Control: no-store that mod_cache obeys -
# no <If> needed anywhere. For the ALLOW case, freshness comes from
# CacheDefaultExpire/CacheMaxExpire below rather than an injected header,
# because the search app's own backend sends "Cache-Control: private" on
# every response (confirmed via curl against the equivalent CKAN page) and
# mod_cache - a SHARED cache - refuses to store anything marked private
# unless told otherwise; CacheStorePrivate On is that override. mod_cache
# also always strips any backend-set Set-Cookie header from what it
# stores/serves, regardless of the rules below - defense-in-depth against
# leaking one visitor's cookie to another.
#
# CacheRoot is re-declared below even though Debian's
# /etc/apache2/mods-enabled/cache_disk.conf already sets it globally -
# confirmed by testing that a vhost-scoped CacheEnable on this host does NOT
# inherit it (error.log: "AH00703: Cannot cache files to disk without a
# CacheRoot specified"). Must match the path in mods-enabled/cache_disk.conf
# and /etc/default/apache2 (htcacheclean's cleanup target).

RewriteEngine on

# Skip the cache unless the request matches ALL of: path starts with /search/,
# /package/, /webassets/, or /base/, no CKAN session cookie, no q= in the
# query string, no /user/ in the path, and it isn't a write/management action.
RewriteCond %{REQUEST_URI} !^/(search|package|webassets|base)/ [OR]
RewriteCond %{HTTP_COOKIE} (^|;\s*)ckan= [OR]
RewriteCond %{QUERY_STRING} (^|&)q= [OR]
RewriteCond %{REQUEST_URI} /user/ [OR]
RewriteCond %{REQUEST_URI} /(new|edit|delete|member_new|member_delete)(/|$)
RewriteRule ^ - [E=CACHE_SKIP:1]

CacheRoot /var/cache/apache2/mod_cache_disk
CacheEnable disk "/search/"
CacheEnable disk "/package/"
CacheEnable disk "/webassets/"
CacheEnable disk "/base/"
CacheIgnoreHeaders Set-Cookie
CacheStorePrivate On
CacheIgnoreNoLastMod On
CacheDefaultExpire 3600
CacheMaxExpire 3600
CacheLock on
CacheLockMaxAge 5
CacheHeader on

Header always set Cache-Control "no-store" env=CACHE_SKIP

# -- to add a future exclusion rule, add one more
#    "RewriteCond ... [OR]" line above the RewriteRule --
