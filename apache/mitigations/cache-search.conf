# Deploy to /etc/apache2/mitigations/cache-search.conf on the host and pull in
# from inside ecosis-search-le-ssl.conf's <VirtualHost *:443> block via:
#   IncludeOptional /etc/apache2/mitigations/cache-search.conf
# Requires: a2enmod cache cache_disk
#
# Reverse-cache anonymous, non-query /search/* responses for 1 hour.
# mod_cache strips Set-Cookie from stored/served responses regardless (built-in
# protection against leaking one visitor's cookie to another), but we also
# gate on request shape below so personalized/dynamic hits are never stored.
#
# NOTE: CacheEnable may be used inside <If>, but CacheDisable may not -
# Apache refuses to start with "CacheDisable cannot occur within <If>
# section". So instead of "enable broadly, then disable exceptions", this
# wraps CacheEnable itself in a single <If> whose condition ANDs together
# every rule that must hold before a response is eligible to be cached.

CacheLock on
CacheLockMaxAge 5
CacheIgnoreCacheControl On
CacheIgnoreHeaders Set-Cookie
CacheDefaultExpire 3600
CacheMaxExpire 3600
CacheHeader on

<If "%{REQUEST_URI} =~ m#^/search/# && %{HTTP_COOKIE} !~ /(^|;\s*)ckan=/ && %{QUERY_STRING} !~ /(^|&)q=/ && %{REQUEST_URI} !~ m#/user/#">
    CacheEnable disk "/search/"
</If>

# -- to add a future exclusion rule, add one more "&& %{...} !~ ..." clause
#    to the <If> condition above --
