# Deploy to /etc/fail2ban/jail.d/apache-reqlimit.conf on the host, then:
#   systemctl restart fail2ban
#   fail2ban-client status apache-reqlimit   # to confirm it's active
#
# Bans an IP that makes >300 requests/min (any path) to data.ecosis.org or
# ecosis.org, independent of mod_evasive's per-page throttling. Escalates the
# ban on repeat offenders instead of a flat 10 minutes.
[apache-reqlimit]
enabled   = true
port      = http,https
filter    = apache-reqlimit
logpath   = /var/log/apache2/access.log
findtime  = 60
maxretry  = 300
bantime   = 600
bantime.increment = true
bantime.factor = 4
bantime.maxtime = 86400
action    = iptables-allports[name=apache-reqlimit]
