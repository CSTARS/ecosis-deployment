# Deploy to /etc/apache2/mitigations/cache-data.conf on the host and pull in
# from inside ecosis-data-le-ssl.conf's <VirtualHost *:443> block via:
#   IncludeOptional /etc/apache2/mitigations/cache-data.conf
# Requires: a2enmod cache cache_disk
#
# Reverse-cache anonymous, non-query, non-action CKAN pages for 1 hour.
# Same protections as cache-search.conf (Set-Cookie stripped on cache store/serve
# by mod_cache regardless; gated on request shape below too).

CacheLock on
CacheLockMaxAge 5
CacheIgnoreCacheControl On
CacheIgnoreHeaders Set-Cookie
CacheDefaultExpire 3600
CacheMaxExpire 3600
CacheMaxFileSize 5000000
CacheHeader on

CacheEnable disk "/dataset/"
CacheEnable disk "/package/"
CacheEnable disk "/organization/"
CacheEnable disk "/group/"

# Rule: logged-in / personalized - has a CKAN session cookie
<If "%{HTTP_COOKIE} =~ /(^|;\s*)ckan=/">
    CacheDisable "/dataset/"
    CacheDisable "/package/"
    CacheDisable "/organization/"
    CacheDisable "/group/"
</If>

# Rule: an actual search query
<If "%{QUERY_STRING} =~ /(^|&)q=/">
    CacheDisable "/dataset/"
    CacheDisable "/package/"
    CacheDisable "/organization/"
    CacheDisable "/group/"
</If>

# Rule: account-specific paths
<If "%{REQUEST_URI} =~ m#/user/#">
    CacheDisable "/dataset/"
    CacheDisable "/package/"
    CacheDisable "/organization/"
    CacheDisable "/group/"
</If>

# Rule: write/management actions - never cache even if somehow reached anonymously
<If "%{REQUEST_URI} =~ m#/(new|edit|delete|member_new|member_delete)(/|$)#">
    CacheDisable "/dataset/"
    CacheDisable "/package/"
    CacheDisable "/organization/"
    CacheDisable "/group/"
</If>

# -- add future exclusion rules above as more <If>/CacheDisable blocks --
