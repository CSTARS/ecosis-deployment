# Deploy to /etc/apache2/mitigations/cache-data.conf on the host and pull in
# from inside ecosis-data-le-ssl.conf's <VirtualHost *:443> block via:
#   IncludeOptional /etc/apache2/mitigations/cache-data.conf
# Requires: a2enmod cache cache_disk macro
#
# Reverse-cache anonymous, non-query, non-action CKAN pages for 1 hour.
# Same protections as cache-search.conf (Set-Cookie stripped on cache
# store/serve by mod_cache regardless; gated on request shape below too).
#
# NOTE: CacheEnable may be used inside <If>, but CacheDisable may not -
# Apache refuses to start with "CacheDisable cannot occur within <If>
# section". So instead of "enable broadly, then disable exceptions", this
# wraps CacheEnable itself in a single <If> whose condition ANDs together
# every rule that must hold before a response is eligible to be cached. A
# mod_macro template is used since the same condition applies to 4 separate
# path prefixes - add a future exclusion rule once, inside the macro, instead
# of once per prefix.

CacheLock on
CacheLockMaxAge 5
CacheIgnoreCacheControl On
CacheIgnoreHeaders Set-Cookie
CacheDefaultExpire 3600
CacheMaxExpire 3600
CacheMaxFileSize 5000000
CacheHeader on

<Macro CacheIfEligible $path>
<If "%{REQUEST_URI} =~ m#^$path# && %{HTTP_COOKIE} !~ /(^|;\s*)ckan=/ && %{QUERY_STRING} !~ /(^|&)q=/ && %{REQUEST_URI} !~ m#/user/# && %{REQUEST_URI} !~ m#/(new|edit|delete|member_new|member_delete)(/|$)#">
    CacheEnable disk "$path"
</If>
</Macro>

Use CacheIfEligible /dataset/
Use CacheIfEligible /package/
Use CacheIfEligible /organization/
Use CacheIfEligible /group/

UndefMacro CacheIfEligible

# -- to add a future exclusion rule, add one more "&& %{...} !~ ..." clause
#    to the <If> condition inside the Macro above --
