# Deploy to /etc/apache2/mitigations/cache-data.conf on the host and pull in
# from inside ecosis-data-le-ssl.conf's <VirtualHost *:443> block via:
#   IncludeOptional /etc/apache2/mitigations/cache-data.conf
# Requires: a2enmod cache cache_disk headers (rewrite is already enabled on
# this host for the http->https redirect)
#
# Reverse-cache anonymous, non-query, non-action CKAN pages for 1 hour.
#
# NOTE: this does NOT use <If> around CacheEnable/CacheDisable - this Apache
# build refuses to start with either ("... cannot occur within <If>
# section"). Instead: mod_rewrite sets an env var when the request is
# NOT eligible to be cached (the exact negation of the rules below, since
# RewriteCond [OR] chains read as "if ANY of these is true, skip caching"),
# then mod_headers turns that into the Cache-Control header mod_cache itself
# obeys - no <If> needed anywhere. mod_cache also always strips any
# backend-set Set-Cookie header from what it stores/serves, regardless of the
# rules below - defense-in-depth against leaking one visitor's cookie to
# another.

RewriteEngine on

# Skip the cache unless the request matches ALL of: path starts with
# /dataset/, /package/, /organization/, or /group/, no CKAN session cookie,
# no q= in the query string, no /user/ in the path, and it isn't a
# write/management action (new/edit/delete/member_new/member_delete).
RewriteCond %{REQUEST_URI} !^/(dataset|package|organization|group)/ [OR]
RewriteCond %{HTTP_COOKIE} (^|;\s*)ckan= [OR]
RewriteCond %{QUERY_STRING} (^|&)q= [OR]
RewriteCond %{REQUEST_URI} /user/ [OR]
RewriteCond %{REQUEST_URI} /(new|edit|delete|member_new|member_delete)(/|$)
RewriteRule ^ - [E=CACHE_SKIP:1]

CacheEnable disk "/dataset/"
CacheEnable disk "/package/"
CacheEnable disk "/organization/"
CacheEnable disk "/group/"
CacheIgnoreHeaders Set-Cookie
CacheMaxFileSize 5000000
CacheLock on
CacheLockMaxAge 5
CacheHeader on

Header always unset Cache-Control
Header always set Cache-Control "no-store" env=CACHE_SKIP
Header always set Cache-Control "max-age=3600" env=!CACHE_SKIP

# -- to add a future exclusion rule, add one more
#    "RewriteCond ... [OR]" line above the RewriteRule --
