# Deploy to /etc/fail2ban/filter.d/apache-reqlimit.conf on the host.
#
# Matches any logged request from a host; fail2ban's own findtime/maxretry in
# the jail is what turns "N matches in the window" into a ban, so this filter
# just needs to reliably extract <HOST> from the combined access log format.
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE) .*" \d+ \d+

# Belt-and-suspenders: never count known-good crawlers toward the ban, even if
# they burst briefly (fail2ban applies this per matched line).
ignoreregex = "[^"]*(Googlebot|bingbot|AhrefsBot)[^"]*"$
