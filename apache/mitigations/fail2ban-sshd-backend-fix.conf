# Deploy to /etc/fail2ban/jail.d/sshd-systemd-backend.conf on the host.
#
# This host has no /var/log/auth.log (no rsyslog, journald-only), so
# fail2ban's stock sshd jail (enabled by default via
# /etc/fail2ban/jail.d/defaults-debian.conf) fails at startup with:
#   "Have not found any log file for sshd jail"
# which crashes the whole fail2ban service, not just that jail.
# Pointing sshd at the systemd/journald backend fixes it without touching
# rsyslog or the apache-reqlimit jail (which reads a real file and is fine
# with the default backend).
[sshd]
backend = systemd
