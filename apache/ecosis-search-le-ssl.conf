<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName ecosis.org
  ServerAdmin webmaster@localhost

KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 2
Timeout 30

  ProxyPass / http://localhost:3004/
  ProxyPassReverse / http://localhost:3004/

  IncludeOptional /etc/apache2/mitigations/cache-search.conf

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined

RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =ecosis.org
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/ecosis.org/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/ecosis.org/privkey.pem
</VirtualHost>
</IfModule>
