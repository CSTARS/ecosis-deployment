version: '3'
services:

  postgres:
    image: postgres:13.1
    volumes:
      - pg-data:/var/lib/postgresql/data
    env_file:
      - .env

  solr:
    image: ckan/ckan-solr:2.10
    volumes:
      - solr-data:/var/solr

  mongo:
    image: mongo:3.4
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:6.0.5
    volumes:
      - redis-data:/data

  search:
    image: us-west1-docker.pkg.dev/ecosis-prod/pub/ecosis-search:dev
    environment:
      - MONGO_HOST=mongo
      - CLIENT_ENV=prod
    depends_on:
      - mongo
    env_file:
      - .env
    ports:
      - "${SEARCH_HOST_PORT:-3000}:8000"

  ckan:
    image: us-west1-docker.pkg.dev/ecosis-prod/pub/ecosis-data:ckan-2.10
    ports:
      - "${DATA_HOST_PORT:-3001}:5000"
    volumes:
      - ckan-data:/var/lib/ckan
      - ckan-backup-data:/backup
      - ckan-tmp:/tmp
      - ./io:/io
    env_file:
      - .env
    environment:
      - CKAN_HOME=/ckan/src
    depends_on:
      - solr
      - mongo
      - postgres

  ckan-helper:
    image: us-west1-docker.pkg.dev/ecosis-prod/pub/ecosis-ckan-helper:ckan-2.10
    volumes:
      - ckan-tmp:/tmp
    env_file:
      - .env

volumes:
  pg-data:
  solr-data:
  mongo-data:
  redis-data:
  ckan-data:
  ckan-tmp:
  ckan-backup-data:
